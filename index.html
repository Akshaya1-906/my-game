<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple To-Do List</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }
      .todo-container {
        background: #fff;
        padding: 2rem;
        margin-top: 3rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        width: 350px;
      }
      h1 {
        text-align: center;
        color: #1976d2;
      }
      .todo-input {
        width: 75%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .add-btn {
        padding: 0.5rem 1rem;
        background: #1976d2;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-left: 0.5rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0;
        border-bottom: 1px solid #eee;
      }
      .remove-btn {
        background: #e53935;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 0.3rem 0.7rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="todo-container">
      <h1>To-Do List</h1>
      <div>
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="Add a new task..."
        />
        <button class="add-btn" onclick="addTodo()">Add</button>
      </div>
      <ul id="todo-list"></ul>
    </div>
    <script>
      function addTodo() {
        const input = document.getElementById("todo-input");
        const value = input.value.trim();
        if (value === "") return;
        const ul = document.getElementById("todo-list");
        const li = document.createElement("li");
        li.innerHTML = `<span>${value}</span> <button class="remove-btn" onclick="removeTodo(this)">Remove</button>`;
        ul.appendChild(li);
        input.value = "";
      }
      function removeTodo(btn) {
        btn.parentElement.remove();
      }
      document
        .getElementById("todo-input")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") addTodo();
        });
    </script>
  </body>
</html>
